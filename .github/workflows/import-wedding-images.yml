name: Import Generated Wedding Images

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-wedding-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated wedding images
        run: |
          mkdir -p public/images
          curl -L --fail --retry 3 "https://at.adobe.com/lwI9HrpdCfisuOjD" -o public/images/wedding-hero.png
          curl -L --fail --retry 3 "https://at.adobe.com/6cIL8AOG3Lmlhd0C" -o public/images/wedding-story.png
          curl -L --fail --retry 3 "https://at.adobe.com/83gmcLGDobxr4g1i" -o public/images/wedding-gallery-1.png
          curl -L --fail --retry 3 "https://at.adobe.com/65yAv2hAUp1DFTKm" -o public/images/wedding-gallery-2.png

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -m "Add generated wedding photography"
          git pull --rebase origin main
          git push
